# Loaded within nginx's http context. Empty keys skip non-Futter requests.
map $uri $futter_api_limit_key {
    default "";
    ~*^/futter/api/ $binary_remote_addr;
}
map $uri $futter_login_limit_key {
    default "";
    ~*^/futter/api/login/?$ $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=futter_requests:1m rate=20r/s;
limit_req_zone $futter_api_limit_key zone=futter_api:1m rate=5r/s;
limit_req_zone $futter_login_limit_key zone=futter_login:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=futter_connections:1m;
limit_conn_zone $server_name zone=futter_total_connections:1m;
