server {
    listen 169.58.211.254:443 ssl;
    server_name 169.58.211.254;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/futter-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futter-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FutterSSL:1m;
    ssl_session_timeout 1d;
    client_max_body_size 128k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    location = / { return 302 /futter/; }
    location = /futter { return 308 /futter/; }
    location / { return 404; }

    location @futter_rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"Zu viele Anfragen. Bitte 10 Sekunden warten."}';
    }

    location ^~ /futter/ {
        limit_req zone=futter_requests burst=40 nodelay;
        limit_req zone=futter_api burst=15 nodelay;
        limit_req zone=futter_login burst=5 nodelay;
        limit_req_status 429;
        limit_conn futter_connections 20;
        limit_conn futter_total_connections 80;
        limit_conn_status 429;
        error_page 429 = @futter_rate_limited;
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_cookie_path / /futter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
