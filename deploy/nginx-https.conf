server {
    listen 169.58.211.254:443 ssl;
    server_name 169.58.211.254;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/futter-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futter-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FutterSSL:1m;
    ssl_session_timeout 1d;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
