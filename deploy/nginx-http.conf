server {
    listen 169.58.211.254:80;
    server_name 169.58.211.254;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/futter-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://169.58.211.254$request_uri;
    }
}
